spring:
  application:
    name: url-shortener-v2
  webflux:
    base-path: /
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/shortener}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    pool:
      max-acquire-time: 3000
      max-idle-time: 900000
      max-life-time: 1800000
      initial-size: 10
      max-size: 50
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DB:0}
      password: ${REDIS_PASSWORD:}
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000

server:
  port: 8080
  tomcat:
    threads:
      max: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 5ms,10ms,50ms,100ms,500ms

logging:
  level:
    root: INFO
    com.example.urlshortener: DEBUG
    org.springframework.data.r2dbc: DEBUG
  format: json
