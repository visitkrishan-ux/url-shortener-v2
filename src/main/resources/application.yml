spring:
  application:
    name: url-shortener-v2

  r2dbc:
    url: r2dbc:h2:mem:///shortener
    username: sa
    password: ""
    pool:
      initial-size: 5
      max-size: 20

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.example.urlshortener: DEBUG
